services:
  db:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: voces
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: voces
    volumes:
      - voces_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voces -d voces"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    build: ./backend
    environment:
      VOCES_ENV: production
      DATABASE_URL: postgresql+psycopg://voces:${POSTGRES_PASSWORD}@db/voces
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${VOCES_DOMAIN}}
      MEDIA_ROOT: /data/media
    volumes:
      - voces_media:/data/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/flutter
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      TLS_MODE: ${TLS_MODE:-none}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  voces_pg:
  voces_media:
  caddy_data:
  caddy_config:
